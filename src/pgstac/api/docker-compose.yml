# STAC API: stac-fastapi-pgstac, talks to the db service over the shared network.
# Browser calls this directly (CORS enabled). Requires pgstac >=0.9,<0.10 (db is v0.9.11).
#
# Run standalone:  docker compose -f api/docker-compose.yml --env-file .env up -d
# (Requires db running and the shared network: docker network create pgstac)

services:
  api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.2.1
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8082
      ENVIRONMENT: local
      # DB connection (db = service name on the shared network).
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DB_MIN_CONN_SIZE: 1
      DB_MAX_CONN_SIZE: 5
      # Browser cross-origin access.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Ingest is via pypgstac directly; HTTP transactions off by default.
      ENABLE_TRANSACTIONS_EXTENSIONS: ${ENABLE_TRANSACTIONS_EXTENSIONS:-FALSE}
    # Skip the image's hardcoded wait-for-it (expects host "database"). Startup
    # ordering against db is added by the main compose (depends_on healthcheck).
    command: ["python", "-m", "stac_fastapi.pgstac.app"]
    ports:
      - "${API_HOST_PORT:-8082}:8082"
    networks:
      - pgstac

networks:
  pgstac:
    external: true
    name: pgstac
